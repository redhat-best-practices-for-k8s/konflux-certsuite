apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: certsuite-operator-test-eaas
  labels:
    app.kubernetes.io/part-of: konflux-certsuite
    upstream-usable: "true"
spec:
  description: |
    Provisions an ephemeral EaaS Hypershift cluster, deploys an operator from
    an FBC fragment, deploys operands from a test bundle, and runs certsuite.
    The cluster is automatically destroyed when the PipelineRun completes.

    This is the recommended variant for most operators. Use the shared-cluster
    variant (certsuite-operator-test.yaml) only when you need a persistent
    cluster with specific hardware or configuration.
  params:
    - name: SNAPSHOT
      type: string
      description: Konflux ApplicationSnapshot JSON
    - name: TEST_BUNDLE_REF
      type: string
      description: |
        Git URL (with optional #path fragment) pointing to the operator's
        certsuite test bundle.
    - name: CERTSUITE_LABELS
      type: string
      default: ""
      description: |
        Comma-separated certsuite test labels (e.g. "networking,lifecycle").
        When empty, all certsuite tests are run.
    - name: PACKAGE_NAME
      type: string
      default: ""
    - name: CHANNEL_NAME
      type: string
      default: ""
    - name: COMPONENT_REPOS
      type: string
      default: ""
      description: |
        Space-separated list of quay.io repo names in the tenant that contain
        operator images (e.g. "my-operator-mono-4-22 my-daemon-mono-4-22").
        Used to resolve registry.redhat.io references to quay.io for
        unreleased images. When empty, the pipeline tries to discover repos
        automatically.
    - name: CREDENTIALS_SECRET_NAME
      type: string
      default: ""
      description: Secret for OCI registry credentials. Empty skips OCI push.
    - name: OCI_REF
      type: string
      default: ""
      description: OCI artifact reference for results. Empty skips OCI push.
    - name: CERT_TRACK_URL
      type: string
      default: ""
      description: Base URL of cert-track-results. Empty skips upload.
    - name: CERT_TRACK_SECRET_NAME
      type: string
      default: ""
    - name: CERT_TRACK_SECRET_KEY
      type: string
      default: "api-token"

  tasks:
    # ── 1. Parse Snapshot Metadata ──────────────────────────────────────
    - name: parse-metadata
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/integration-examples
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/test_metadata.yaml
      params:
        - name: SNAPSHOT
          value: $(params.SNAPSHOT)

    # ── 2. Provision EaaS Space ────────────────────────────────────────
    - name: provision-eaas-space
      runAfter:
        - parse-metadata
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/build-definitions.git
          - name: revision
            value: main
          - name: pathInRepo
            value: task/eaas-provision-space/0.1/eaas-provision-space.yaml
      params:
        - name: ownerName
          value: $(context.pipelineRun.name)
        - name: ownerUid
          value: $(context.pipelineRun.uid)

    # ── 3. Get Unreleased Bundle from FBC ──────────────────────────────
    - name: get-unreleased-bundle
      runAfter:
        - provision-eaas-space
      taskSpec:
        results:
          - name: unreleasedBundle
            value: "$(steps.get-bundle.results.unreleasedBundle)"
          - name: packageName
            value: "$(steps.get-bundle.results.packageName)"
          - name: channelName
            value: "$(steps.get-bundle.results.channelName)"
        steps:
          - name: get-bundle
            computeResources:
              limits:
                memory: 8Gi
              requests:
                memory: 8Gi
                cpu: "1"
            ref:
              resolver: git
              params:
                - name: url
                  value: https://github.com/konflux-ci/tekton-integration-catalog.git
                - name: revision
                  value: main
                - name: pathInRepo
                  value: stepactions/bundles/get-unreleased-bundle/0.1/get-unreleased-bundle.yaml
            params:
              - name: fbcFragment
                value: "$(tasks.parse-metadata.results.component-container-image)"
              - name: packageName
                value: $(params.PACKAGE_NAME)
              - name: channelName
                value: $(params.CHANNEL_NAME)

    # ── 4. Pick Cluster Params ─────────────────────────────────────────
    - name: pick-cluster-params
      runAfter:
        - get-unreleased-bundle
      when:
        - input: "$(tasks.get-unreleased-bundle.results.unreleasedBundle)"
          operator: notin
          values: [""]
      taskSpec:
        results:
          - name: ocpVersion
            value: "$(steps.pick-cluster-version.results.ocpVersion)"
          - name: bundleArch
            value: "$(steps.pick-cluster-arch.results.bundleArch)"
        steps:
          - name: get-supported-versions
            ref:
              resolver: git
              params:
                - name: url
                  value: https://github.com/konflux-ci/build-definitions.git
                - name: revision
                  value: main
                - name: pathInRepo
                  value: stepactions/eaas-get-supported-ephemeral-cluster-versions/0.1/eaas-get-supported-ephemeral-cluster-versions.yaml
            params:
              - name: eaasSpaceSecretRef
                value: "$(tasks.provision-eaas-space.results.secretRef)"
          - name: pick-cluster-version
            ref:
              resolver: git
              params:
                - name: url
                  value: https://github.com/konflux-ci/tekton-integration-catalog.git
                - name: revision
                  value: main
                - name: pathInRepo
                  value: stepactions/bundles/pick-cluster-version/0.1/pick-cluster-version.yaml
            params:
              - name: fbcFragment
                value: "$(tasks.parse-metadata.results.component-container-image)"
              - name: clusterVersions
                value: ["$(steps.get-supported-versions.results.versions[*])"]
          - name: pick-cluster-arch
            ref:
              resolver: git
              params:
                - name: url
                  value: https://github.com/konflux-ci/tekton-integration-catalog.git
                - name: revision
                  value: main
                - name: pathInRepo
                  value: stepactions/bundles/pick-cluster-arch/0.1/pick-cluster-arch.yaml
            params:
              - name: bundleImage
                value: "$(tasks.parse-metadata.results.component-container-image)"

    # ── 5. Provision Ephemeral Cluster ─────────────────────────────────
    - name: provision-cluster
      runAfter:
        - pick-cluster-params
      when:
        - input: "$(tasks.get-unreleased-bundle.results.unreleasedBundle)"
          operator: notin
          values: [""]
        - input: "$(tasks.pick-cluster-params.results.ocpVersion)"
          operator: notin
          values: [""]
        - input: "$(tasks.pick-cluster-params.results.bundleArch)"
          operator: notin
          values: [""]
      taskSpec:
        results:
          - name: clusterName
            value: "$(steps.create-cluster.results.clusterName)"
        steps:
          - name: get-latest-version-tag
            ref:
              resolver: git
              params:
                - name: url
                  value: https://github.com/konflux-ci/build-definitions.git
                - name: revision
                  value: main
                - name: pathInRepo
                  value: stepactions/eaas-get-latest-openshift-version-by-prefix/0.1/eaas-get-latest-openshift-version-by-prefix.yaml
            params:
              - name: prefix
                value: "$(tasks.pick-cluster-params.results.ocpVersion)"
          - name: create-cluster
            ref:
              resolver: git
              params:
                - name: url
                  value: https://github.com/konflux-ci/build-definitions.git
                - name: revision
                  value: main
                - name: pathInRepo
                  value: stepactions/eaas-create-ephemeral-cluster-hypershift-aws/0.1/eaas-create-ephemeral-cluster-hypershift-aws.yaml
            params:
              - name: eaasSpaceSecretRef
                value: $(tasks.provision-eaas-space.results.secretRef)
              - name: version
                value: "$(steps.get-latest-version-tag.results.version)"
              - name: instanceType
                value: "$(tasks.pick-cluster-params.results.bundleArch)"

    # ── 6. Deploy Operator + Operands + Run Certsuite ──────────────────
    - name: deploy-and-test
      runAfter:
        - provision-cluster
      when:
        - input: "$(tasks.get-unreleased-bundle.results.unreleasedBundle)"
          operator: notin
          values: [""]
      params:
        - name: eaasSpaceSecretRef
          value: $(tasks.provision-eaas-space.results.secretRef)
        - name: clusterName
          value: "$(tasks.provision-cluster.results.clusterName)"
        - name: fbcFragment
          value: "$(tasks.parse-metadata.results.component-container-image)"
        - name: bundleImage
          value: "$(tasks.get-unreleased-bundle.results.unreleasedBundle)"
        - name: packageName
          value: "$(tasks.get-unreleased-bundle.results.packageName)"
        - name: channelName
          value: "$(tasks.get-unreleased-bundle.results.channelName)"
        - name: testBundleRef
          value: $(params.TEST_BUNDLE_REF)
        - name: certsuiteLabels
          value: $(params.CERTSUITE_LABELS)
        - name: snapshot
          value: $(params.SNAPSHOT)
        - name: componentRepos
          value: $(params.COMPONENT_REPOS)
      taskSpec:
        params:
          - name: eaasSpaceSecretRef
            type: string
          - name: clusterName
            type: string
          - name: fbcFragment
            type: string
          - name: bundleImage
            type: string
          - name: packageName
            type: string
          - name: channelName
            type: string
          - name: testBundleRef
            type: string
          - name: certsuiteLabels
            type: string
          - name: snapshot
            type: string
          - name: componentRepos
            type: string
        volumes:
          - name: credentials
            emptyDir: {}
        steps:
          # ── Step 1: Get kubeconfig from EaaS ─────────────────────────
          - name: get-kubeconfig
            ref:
              resolver: git
              params:
                - name: url
                  value: https://github.com/konflux-ci/build-definitions.git
                - name: revision
                  value: main
                - name: pathInRepo
                  value: stepactions/eaas-get-ephemeral-cluster-credentials/0.1/eaas-get-ephemeral-cluster-credentials.yaml
            params:
              - name: eaasSpaceSecretRef
                value: $(params.eaasSpaceSecretRef)
              - name: clusterName
                value: $(params.clusterName)
              - name: credentials
                value: credentials

          # ── Step 2: Deploy operator via OLM ──────────────────────────
          - name: deploy-operator
            image: quay.io/konflux-ci/konflux-test:v1.4.31@sha256:a7cae9e96663e277a3904d0c78630508ddb6cc8eebaa912a840bd20f68dcaad1
            onError: continue
            computeResources:
              limits:
                memory: 4Gi
              requests:
                memory: 4Gi
                cpu: 500m
            volumeMounts:
              - name: credentials
                mountPath: /credentials
            env:
              - name: KUBECONFIG
                value: "/credentials/$(steps.get-kubeconfig.results.kubeconfig)"
              - name: FBC_FRAGMENT
                value: "$(params.fbcFragment)"
              - name: BUNDLE_IMAGE
                value: "$(params.bundleImage)"
              - name: PACKAGE_NAME
                value: "$(params.packageName)"
              - name: CHANNEL_NAME
                value: "$(params.channelName)"
              - name: SNAPSHOT
                value: "$(params.snapshot)"
            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              echo "[$(date -u +%FT%T.%3NZ)] Deploying operator: package=${PACKAGE_NAME} channel=${CHANNEL_NAME}"
              oc whoami || { echo "ERROR: Cannot connect to cluster"; exit 1; }

              # Print console credentials for debugging (ephemeral cluster)
              PASSWORD_FILE=$(ls /credentials/*-password 2>/dev/null | head -1)
              if [[ -n "${PASSWORD_FILE}" ]]; then
                echo "[$(date -u +%FT%T.%3NZ)] Console login: username=kubeadmin password=$(cat ${PASSWORD_FILE})"
              fi

              # Resolve the bundle image to an accessible quay.io path
              BUNDLE_DIGEST="${BUNDLE_IMAGE##*@}"

              # Try 1: Find in SNAPSHOT by digest match
              QUAY_BUNDLE=$(echo "${SNAPSHOT}" | jq -r \
                --arg digest "${BUNDLE_DIGEST}" \
                '.components[] | select(.containerImage | endswith($digest)) | .containerImage' | head -1)

              # Try 2: Derive from FBC fragment path (same tenant, replace -fbc- with -bundle-mono-)
              if [[ -z "${QUAY_BUNDLE}" ]]; then
                FBC_BASE="${FBC_FRAGMENT%%@*}"
                TENANT_AND_REPO="${FBC_BASE#quay.io/redhat-user-workloads/}"
                TENANT="${TENANT_AND_REPO%%/*}"
                FBC_REPO="${TENANT_AND_REPO#*/}"
                BUNDLE_REPO=$(echo "${FBC_REPO}" | sed 's/-fbc-/-bundle-mono-/')

                CANDIDATE="quay.io/redhat-user-workloads/${TENANT}/${BUNDLE_REPO}@${BUNDLE_DIGEST}"
                echo "[$(date -u +%FT%T.%3NZ)] Trying derived path: ${CANDIDATE}"
                SKOPEO_ERR=$(skopeo inspect --raw "docker://${CANDIDATE}" 2>&1) && QUAY_BUNDLE="${CANDIDATE}"

                if [[ -z "${QUAY_BUNDLE}" ]]; then
                  echo "[$(date -u +%FT%T.%3NZ)] skopeo error: ${SKOPEO_ERR}"
                  # Also try without -mono-
                  BUNDLE_REPO2=$(echo "${FBC_REPO}" | sed 's/-fbc-/-bundle-/')
                  CANDIDATE2="quay.io/redhat-user-workloads/${TENANT}/${BUNDLE_REPO2}@${BUNDLE_DIGEST}"
                  echo "[$(date -u +%FT%T.%3NZ)] Trying: ${CANDIDATE2}"
                  SKOPEO_ERR2=$(skopeo inspect --raw "docker://${CANDIDATE2}" 2>&1) && QUAY_BUNDLE="${CANDIDATE2}"
                  [[ -z "${QUAY_BUNDLE}" ]] && echo "[$(date -u +%FT%T.%3NZ)] skopeo error: ${SKOPEO_ERR2}"
                fi
              fi

              if [[ -n "${QUAY_BUNDLE}" ]]; then
                echo "[$(date -u +%FT%T.%3NZ)] Resolved bundle: ${QUAY_BUNDLE}"
                RENDER_IMAGE="${QUAY_BUNDLE}"
              else
                echo "[$(date -u +%FT%T.%3NZ)] WARNING: Could not resolve quay.io bundle, trying original: ${BUNDLE_IMAGE}"
                echo "[$(date -u +%FT%T.%3NZ)] SNAPSHOT components:"
                echo "${SNAPSHOT}" | jq -r '.components[] | "  - \(.name): \(.containerImage)"'
                RENDER_IMAGE="${BUNDLE_IMAGE}"
              fi

              echo "[$(date -u +%FT%T.%3NZ)] Rendering bundle: ${RENDER_IMAGE}"
              if ! bundle_render_out=$(opm render "${RENDER_IMAGE}"); then
                echo "ERROR: Failed to render bundle image" >&2
                exit 1
              fi

              # Determine install namespace
              INSTALL_NAMESPACE=$(echo "${bundle_render_out}" | \
                jq -r 'select(.schema == "olm.bundle") | .properties[]? |
                select(.type == "olm.bundle.object") | .value.data' 2>/dev/null | \
                base64 -d 2>/dev/null | \
                jq -r 'select(.kind == "ClusterServiceVersion") |
                .metadata.annotations["operatorframework.io/suggested-namespace"] // empty' 2>/dev/null | \
                head -1)

              if [[ -z "${INSTALL_NAMESPACE}" || "${INSTALL_NAMESPACE}" == "null" ]]; then
                INSTALL_NAMESPACE=$(oc create -f - -o jsonpath='{.metadata.name}' <<NS_EOF
              apiVersion: v1
              kind: Namespace
              metadata:
                generateName: oo-
              NS_EOF
                )
              elif ! oc get namespace "${INSTALL_NAMESPACE}" &>/dev/null; then
                oc create namespace "${INSTALL_NAMESPACE}"
              fi

              echo "[$(date -u +%FT%T.%3NZ)] Namespace: ${INSTALL_NAMESPACE}"
              echo -n "${INSTALL_NAMESPACE}" > /workspace/install-namespace

              # OperatorGroup (OwnNamespace mode — most operators require this)
              EXISTING_OG=$(oc -n "${INSTALL_NAMESPACE}" get operatorgroup -o jsonpath="{.items[*].metadata.name}" 2>/dev/null || true)
              if [[ -z "${EXISTING_OG}" ]]; then
                oc create -f - <<OG_EOF
              apiVersion: operators.coreos.com/v1
              kind: OperatorGroup
              metadata:
                generateName: oo-
                namespace: ${INSTALL_NAMESPACE}
              spec:
                targetNamespaces:
                  - ${INSTALL_NAMESPACE}
              OG_EOF
              fi

              # ═══════════════════════════════════════════════════════════════════
              # OLM FLOW: CatalogSource -> Subscription -> patch CSV -> recreate
              # ═══════════════════════════════════════════════════════════════════

              # CatalogSource (FBC fragment from quay.io)
              CATSRC=$(oc create -f - -o jsonpath='{.metadata.name}' <<CS_EOF
              apiVersion: operators.coreos.com/v1alpha1
              kind: CatalogSource
              metadata:
                generateName: oo-
                namespace: ${INSTALL_NAMESPACE}
              spec:
                sourceType: grpc
                image: ${FBC_FRAGMENT}
                displayName: "Certsuite Test Catalog"
                publisher: "konflux-certsuite"
              CS_EOF
              )
              echo "[$(date -u +%FT%T.%3NZ)] CatalogSource: ${CATSRC}"

              # Wait for CatalogSource READY
              for i in $(seq 1 60); do
                STATE=$(oc get catalogsource "${CATSRC}" -n "${INSTALL_NAMESPACE}" \
                  -o jsonpath='{.status.connectionState.lastObservedState}' 2>/dev/null || echo "")
                [[ "${STATE}" == "READY" ]] && break
                [[ ${i} -eq 60 ]] && { echo "ERROR: CatalogSource not ready"; oc get catalogsource "${CATSRC}" -n "${INSTALL_NAMESPACE}" -o yaml >&2; exit 1; }
                sleep 10
              done

              # Get bundle name for startingCSV
              BUNDLE_NAME=$(echo "${bundle_render_out}" | jq -r 'select(.schema == "olm.bundle") | .name' | head -1)
              echo "[$(date -u +%FT%T.%3NZ)] Bundle/startingCSV: ${BUNDLE_NAME}"

              # Pre-create ServiceAccounts and grant cluster-admin (OLM checks RBAC)
              MANIFESTS_DIR="/tmp/bundle-manifests"
              mkdir -p "${MANIFESTS_DIR}"
              oc image extract "${RENDER_IMAGE}" --path /manifests/:${MANIFESTS_DIR}/ --confirm 2>&1 || true
              for SA in $(grep -h 'serviceAccountName:' "${MANIFESTS_DIR}"/*.yaml 2>/dev/null | awk '{print $2}' | sort -u); do
                oc create serviceaccount "${SA}" -n "${INSTALL_NAMESPACE}" 2>/dev/null || true
                oc adm policy add-cluster-role-to-user cluster-admin -z "${SA}" -n "${INSTALL_NAMESPACE}" 2>/dev/null || true
              done

              # Subscription
              SUB=$(oc create -f - -o jsonpath='{.metadata.name}' <<SUB_EOF
              apiVersion: operators.coreos.com/v1alpha1
              kind: Subscription
              metadata:
                generateName: oo-
                namespace: ${INSTALL_NAMESPACE}
              spec:
                channel: ${CHANNEL_NAME}
                installPlanApproval: Automatic
                name: ${PACKAGE_NAME}
                source: ${CATSRC}
                sourceNamespace: ${INSTALL_NAMESPACE}
                startingCSV: ${BUNDLE_NAME}
              SUB_EOF
              )
              echo "[$(date -u +%FT%T.%3NZ)] Subscription: ${SUB}"

              # Wait for OLM to create the CSV
              echo "[$(date -u +%FT%T.%3NZ)] Waiting for OLM to create CSV..."
              CSV_NAME=""
              for i in $(seq 1 60); do
                CSV_NAME=$(oc get subscription "${SUB}" -n "${INSTALL_NAMESPACE}" \
                  -o jsonpath='{.status.installedCSV}' 2>/dev/null || echo "")
                [[ -n "${CSV_NAME}" ]] && break
                sleep 5
              done

              if [[ -z "${CSV_NAME}" ]]; then
                echo "ERROR: OLM did not create a CSV" >&2
                oc get subscription "${SUB}" -n "${INSTALL_NAMESPACE}" -o yaml >&2
                oc get installplan -n "${INSTALL_NAMESPACE}" -o yaml >&2 || true
                exit 1
              fi
              echo "[$(date -u +%FT%T.%3NZ)] CSV created: ${CSV_NAME}"

              # ── Patch the CSV in-place ──────────────────────────────────────
              CSV_JSON=$(oc get csv "${CSV_NAME}" -n "${INSTALL_NAMESPACE}" -o json)

              # Remove minKubeVersion
              CSV_JSON=$(echo "${CSV_JSON}" | jq 'del(.spec.minKubeVersion)')

              # Remove master nodeSelector
              CSV_JSON=$(echo "${CSV_JSON}" | jq '
                (.spec.install.spec.deployments[]?.spec.template.spec.nodeSelector) |=
                  (if . then del(.["node-role.kubernetes.io/master"]) else . end)')

              # Add certsuite labels to deployment pod templates
              CSV_JSON=$(echo "${CSV_JSON}" | jq '
                (.spec.install.spec.deployments[]?.spec.template.metadata.labels) +=
                  {"redhat-best-practices-for-k8s.com/generic": "target",
                   "redhat-best-practices-for-k8s.com/operator": "target"}')

              # Patch image references
              echo "[$(date -u +%FT%T.%3NZ)] Patching image references..."
              FBC_BASE="${FBC_FRAGMENT%%@*}"
              TENANT_AND_REPO="${FBC_BASE#quay.io/redhat-user-workloads/}"
              TENANT="${TENANT_AND_REPO%%/*}"
              QUAY_BASE="quay.io/redhat-user-workloads/${TENANT}"
              COMPONENT_REPOS="$(params.componentRepos)"
              REPOS="${COMPONENT_REPOS}"

              IMAGES=$(echo "${CSV_JSON}" | grep -oP 'registry\.redhat\.io/[^"]+@sha256:[a-f0-9]+' | sort -u)
              for IMG in ${IMAGES}; do
                DIGEST="${IMG##*@}"
                RESOLVED=""
                for REPO in ${REPOS}; do
                  CANDIDATE="${QUAY_BASE}/${REPO}@${DIGEST}"
                  if skopeo inspect --raw "docker://${CANDIDATE}" &>/dev/null; then
                    RESOLVED="${CANDIDATE}"
                    break
                  fi
                done
                if [[ -n "${RESOLVED}" ]]; then
                  echo "  ${IMG} -> ${RESOLVED}"
                  CSV_JSON=$(echo "${CSV_JSON}" | sed "s|${IMG}|${RESOLVED}|g")
                elif echo "${IMG}" | grep -q "kube-rbac-proxy"; then
                  FALLBACK="quay.io/brancz/kube-rbac-proxy:v0.18.1"
                  echo "  ${IMG} -> ${FALLBACK}"
                  CSV_JSON=$(echo "${CSV_JSON}" | sed "s|${IMG}|${FALLBACK}|g")
                else
                  echo "  ${IMG} -> NOT FOUND (leaving as-is)"
                fi
              done

              # Apply patched CSV
              echo "[$(date -u +%FT%T.%3NZ)] Applying patched CSV..."
              echo "${CSV_JSON}" | oc apply -f - 2>&1

              # Delete Deployment(s) so OLM recreates from patched CSV
              echo "[$(date -u +%FT%T.%3NZ)] Deleting operator Deployment(s) to force recreation..."
              for DEP_NAME in $(echo "${CSV_JSON}" | jq -r '.spec.install.spec.deployments[]?.name'); do
                oc delete deployment "${DEP_NAME}" -n "${INSTALL_NAMESPACE}" --ignore-not-found 2>&1
              done

              # Wait for CSV Succeeded
              echo "[$(date -u +%FT%T.%3NZ)] Waiting for CSV '${CSV_NAME}' phase=Succeeded..."
              for i in $(seq 1 90); do
                PHASE=$(oc get csv "${CSV_NAME}" -n "${INSTALL_NAMESPACE}" \
                  -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
                if [[ "${PHASE}" == "Succeeded" ]]; then
                  echo "[$(date -u +%FT%T.%3NZ)] CSV '${CSV_NAME}' ready"
                  exit 0
                elif [[ "${PHASE}" == "Failed" ]]; then
                  echo "ERROR: CSV failed:" >&2
                  oc get csv "${CSV_NAME}" -n "${INSTALL_NAMESPACE}" -o jsonpath='{.status.message}' >&2
                  exit 1
                fi
                sleep 10
              done

              echo "ERROR: Timed out waiting for CSV '${CSV_NAME}' (phase=${PHASE})" >&2
              oc get pods -n "${INSTALL_NAMESPACE}" -o wide >&2 || true
              oc get events -n "${INSTALL_NAMESPACE}" --sort-by='.lastTimestamp' 2>&1 | tail -20 >&2 || true
              exit 1

          # ── Step 3: Deploy operands from test bundle ─────────────────
          - name: deploy-operands
            image: quay.io/konflux-ci/konflux-test:v1.4.31@sha256:a7cae9e96663e277a3904d0c78630508ddb6cc8eebaa912a840bd20f68dcaad1
            volumeMounts:
              - name: credentials
                mountPath: /credentials
            env:
              - name: KUBECONFIG
                value: "/credentials/$(steps.get-kubeconfig.results.kubeconfig)"
              - name: TEST_BUNDLE_REF
                value: "$(params.testBundleRef)"
            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              INSTALL_NAMESPACE=""
              [[ -f /workspace/install-namespace ]] && INSTALL_NAMESPACE=$(cat /workspace/install-namespace)

              # Fetch test bundle
              BUNDLE_DIR="/workspace/test-bundle"
              mkdir -p "${BUNDLE_DIR}"

              # Parse TEST_BUNDLE_REF: url[@branch]#path
              GIT_URL="${TEST_BUNDLE_REF%%#*}"
              BUNDLE_PATH="${TEST_BUNDLE_REF#*#}"
              [[ "${BUNDLE_PATH}" == "${TEST_BUNDLE_REF}" ]] && BUNDLE_PATH="."

              GIT_BRANCH=""
              if [[ "${GIT_URL}" == *"@"* && "${GIT_URL}" != *"@sha256:"* ]]; then
                GIT_BRANCH="${GIT_URL##*@}"
                GIT_URL="${GIT_URL%@*}"
              fi

              echo "[$(date -u +%FT%T.%3NZ)] Cloning ${GIT_URL} (branch: ${GIT_BRANCH:-default}, path: ${BUNDLE_PATH})"
              CLONE_DIR=$(mktemp -d)
              git clone --depth 1 ${GIT_BRANCH:+--branch "${GIT_BRANCH}"} "${GIT_URL}" "${CLONE_DIR}"
              cp -r "${CLONE_DIR}/${BUNDLE_PATH}/." "${BUNDLE_DIR}/"
              rm -rf "${CLONE_DIR}"

              if [[ ! -f "${BUNDLE_DIR}/certsuite-test-bundle.yaml" ]]; then
                echo "ERROR: certsuite-test-bundle.yaml not found" >&2
                exit 1
              fi

              # Determine target namespace
              TARGET_NS=$(grep -A1 'namespace:' "${BUNDLE_DIR}/certsuite-test-bundle.yaml" | tail -1 | awk '{print $NF}' || echo "")
              TARGET_NS="${TARGET_NS:-${INSTALL_NAMESPACE}}"

              echo "[$(date -u +%FT%T.%3NZ)] Deploying operands to: ${TARGET_NS}"

              if [[ -n "${TARGET_NS}" && "${TARGET_NS}" != "${INSTALL_NAMESPACE}" ]]; then
                oc create namespace "${TARGET_NS}" 2>/dev/null || true
              fi

              # Apply prerequisites
              if [[ -d "${BUNDLE_DIR}/prerequisites" ]]; then
                oc apply -n "${TARGET_NS}" -f "${BUNDLE_DIR}/prerequisites/" 2>/dev/null || true
              fi

              # Apply operands
              if [[ -d "${BUNDLE_DIR}/operands" ]]; then
                oc apply -n "${TARGET_NS}" -f "${BUNDLE_DIR}/operands/"
              fi

              # Wait for deployments
              DEPS=$(oc get deployments -n "${TARGET_NS}" -o jsonpath='{.items[*].metadata.name}' 2>/dev/null || echo "")
              for DEP in ${DEPS}; do
                echo "  Waiting for deployment/${DEP}..."
                oc rollout status "deployment/${DEP}" -n "${TARGET_NS}" --timeout=300s || true
              done

              echo "[$(date -u +%FT%T.%3NZ)] Operand deployment complete"

              # Wait for operator to reconcile and create DaemonSet pods
              echo "[$(date -u +%FT%T.%3NZ)] Waiting 60s for operator to reconcile..."
              sleep 60

              # Label DaemonSet pods for certsuite (DaemonSets are not managed by OLM)
              echo "[$(date -u +%FT%T.%3NZ)] Labeling DaemonSet pods for certsuite..."
              for DS in $(oc get daemonsets -n "${TARGET_NS}" -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
                oc patch daemonset "${DS}" -n "${TARGET_NS}" --type=merge -p \
                  '{"spec":{"template":{"metadata":{"labels":{"redhat-best-practices-for-k8s.com/generic":"target"}}}}}' 2>&1 || true
              done
              # Wait for DaemonSet rollout
              for DS in $(oc get daemonsets -n "${TARGET_NS}" -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
                oc rollout status "daemonset/${DS}" -n "${TARGET_NS}" --timeout=120s 2>&1 || true
              done

              echo "[$(date -u +%FT%T.%3NZ)] Pods in namespace '${TARGET_NS}':"
              oc get pods -n "${TARGET_NS}" --show-labels 2>&1 || true
              echo "[$(date -u +%FT%T.%3NZ)] DaemonSets:"
              oc get daemonsets -n "${TARGET_NS}" 2>&1 || true

          # ── Step 4: Run certsuite ────────────────────────────────────
          - name: run-certsuite
            image: quay.io/redhat-best-practices-for-k8s/certsuite:latest
            onError: continue
            computeResources:
              limits:
                memory: 4Gi
              requests:
                memory: 2Gi
                cpu: 500m
            volumeMounts:
              - name: credentials
                mountPath: /credentials
            env:
              - name: KUBECONFIG
                value: "/credentials/$(steps.get-kubeconfig.results.kubeconfig)"
              - name: CERTSUITE_LABELS
                value: "$(params.certsuiteLabels)"
            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              # Force certsuite to use the EaaS cluster kubeconfig
              unset KUBERNETES_SERVICE_HOST KUBERNETES_SERVICE_PORT
              mkdir -p ~/.kube
              cp "${KUBECONFIG}" ~/.kube/config
              export KUBECONFIG=~/.kube/config

              echo "[$(date -u +%FT%T.%3NZ)] KUBECONFIG=${KUBECONFIG}"
              if [[ ! -f "${KUBECONFIG}" ]]; then
                echo "ERROR: Kubeconfig file not found at ${KUBECONFIG}" >&2
                exit 1
              fi

              # Debug: check if in-cluster SA token exists
              if [[ -f /var/run/secrets/kubernetes.io/serviceaccount/token ]]; then
                echo "[$(date -u +%FT%T.%3NZ)] WARNING: In-cluster SA token exists, removing to prevent interference"
                rm -f /var/run/secrets/kubernetes.io/serviceaccount/token 2>/dev/null || \
                  echo "[$(date -u +%FT%T.%3NZ)] Cannot remove SA token (read-only), overriding via HOME"
              fi

              # Debug: show kubeconfig server
              echo "[$(date -u +%FT%T.%3NZ)] Kubeconfig server: $(grep -m1 'server:' ~/.kube/config | awk '{print $2}')"
              echo "[$(date -u +%FT%T.%3NZ)] Kubeconfig user: $(grep -m1 'name:' ~/.kube/config | awk '{print $2}')"

              INSTALL_NS=""
              [[ -f /workspace/install-namespace ]] && INSTALL_NS=$(cat /workspace/install-namespace)

              RESULTS_DIR="/workspace/results"
              CONFIG_FILE="/workspace/test-bundle/certsuite_config.yml"
              mkdir -p "${RESULTS_DIR}"

              # Read install namespace from deploy-operator step
              INSTALL_NS=""
              [[ -f /workspace/install-namespace ]] && INSTALL_NS=$(cat /workspace/install-namespace)

              if [[ ! -f "${CONFIG_FILE}" ]]; then
                echo "[$(date -u +%FT%T.%3NZ)] No certsuite_config.yml in test bundle, generating minimal config..."
                CONFIG_FILE="/workspace/certsuite_config.yml"
                printf '%s\n' \
                  "targetNameSpaces:" \
                  "  - name: \"${INSTALL_NS}\"" \
                  "podsUnderTestLabels:" \
                  "  - \"redhat-best-practices-for-k8s.com/generic: target\"" \
                  > "${CONFIG_FILE}"
                echo "[$(date -u +%FT%T.%3NZ)] Generated config:"
                cat "${CONFIG_FILE}"
              fi

              # Debug: show the config being used
              echo "[$(date -u +%FT%T.%3NZ)] === Certsuite Config ==="
              cat "${CONFIG_FILE}"
              echo "[$(date -u +%FT%T.%3NZ)] === Test Bundle Contents ==="
              ls -la /workspace/test-bundle/ 2>&1 || true
              echo "==========================="

              # Copy config to certsuite's default location
              mkdir -p config
              cp "${CONFIG_FILE}" config/certsuite_config.yml

              CONFIG_ARGS="--config-file ${CONFIG_FILE} --kubeconfig ${KUBECONFIG}"

              if [[ -z "${CERTSUITE_LABELS}" ]]; then
                SUITE_DIR="${RESULTS_DIR}/all"
                mkdir -p "${SUITE_DIR}"
                echo "[$(date -u +%FT%T.%3NZ)] Running all certsuite tests"

                set +e
                certsuite run \
                  --output-dir "${SUITE_DIR}" \
                  ${CONFIG_ARGS} \
                  2>&1 | tee "${SUITE_DIR}/certsuite.log"
                set -e
              else
                IFS=',' read -ra LABELS <<< "${CERTSUITE_LABELS}"
                for LABEL in "${LABELS[@]}"; do
                  LABEL=$(echo "${LABEL}" | xargs)
                  SUITE_DIR="${RESULTS_DIR}/${LABEL}"
                  mkdir -p "${SUITE_DIR}"

                  echo "[$(date -u +%FT%T.%3NZ)] Running: ${LABEL}"
                  set +e
                  certsuite run \
                    --label-filter "${LABEL}" \
                    --output-dir "${SUITE_DIR}" \
                    ${CONFIG_ARGS} \
                    2>&1 | tee "${SUITE_DIR}/certsuite.log"
                  set -e
                done
              fi

              # Print discovery results from debug log
              echo "[$(date -u +%FT%T.%3NZ)] === Discovery Log (first 50 lines) ==="
              grep -i -A2 "discovery\|found\|pod\|label\|namespace\|config" "${RESULTS_DIR}"/*/certsuite.log 2>/dev/null | head -50 || true
              echo "==========================="

              # Print summary
              for CLAIM in "${RESULTS_DIR}"/*/claim.json; do
                [[ -f "${CLAIM}" ]] || continue
                SUITE=$(basename "$(dirname "${CLAIM}")")
                TOTAL=$(jq '.claim.results | length' "${CLAIM}" 2>/dev/null || echo "?")
                PASSED=$(jq '[.claim.results[] | select(.state == "passed")] | length' "${CLAIM}" 2>/dev/null || echo "?")
                FAILED=$(jq '[.claim.results[] | select(.state == "failed")] | length' "${CLAIM}" 2>/dev/null || echo "?")
                echo "[$(date -u +%FT%T.%3NZ)] ${SUITE}: total=${TOTAL} passed=${PASSED} failed=${FAILED}"
              done

    # Results are printed in the deploy-and-test step's certsuite summary.
    # cert-track and OCI push can be added here when needed.
