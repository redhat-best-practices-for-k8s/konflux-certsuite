apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: certsuite-operator-test-eaas
  labels:
    app.kubernetes.io/part-of: konflux-certsuite
    upstream-usable: "true"
spec:
  description: |
    Provisions an ephemeral EaaS Hypershift cluster, deploys an operator from
    an FBC fragment, deploys operands from a test bundle, and runs certsuite.
    The cluster is automatically destroyed when the PipelineRun completes.

    This is the recommended variant for most operators. Use the shared-cluster
    variant (certsuite-operator-test.yaml) only when you need a persistent
    cluster with specific hardware or configuration.
  params:
    - name: SNAPSHOT
      type: string
      description: Konflux ApplicationSnapshot JSON
    - name: TEST_BUNDLE_REF
      type: string
      description: |
        Git URL pointing to the operator's certsuite test bundle.
        Format: URL[.git@revision][#path]
        Examples:
          https://github.com/org/repo.git@main#tests/my-bundle
          https://github.com/org/repo#tests/my-bundle
          https://github.com/org/repo.git@fix/my-branch#tests/my-bundle
    - name: CERTSUITE_LABELS
      type: string
      default: "common"
      description: |
        Comma-separated certsuite test labels (e.g. "networking,lifecycle").
        When empty, all certsuite tests are run.
    - name: PACKAGE_NAME
      type: string
      default: ""
    - name: CHANNEL_NAME
      type: string
      default: ""
    # NOTE: CREDENTIALS_SECRET_NAME, OCI_REF, CERT_TRACK_* params are not
    # included here because Konflux IntegrationTestScenarios do not provide
    # pipeline-level workspace bindings needed by the collect-results task.
    # Results collection should be added as a step inside deploy-and-test
    # when needed.

  tasks:
    # ── 1. Parse Snapshot Metadata ──────────────────────────────────────
    - name: parse-metadata
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/integration-examples
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/test_metadata.yaml
      params:
        - name: SNAPSHOT
          value: $(params.SNAPSHOT)

    # ── 2. Provision EaaS Space ────────────────────────────────────────
    - name: provision-eaas-space
      runAfter:
        - parse-metadata
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/build-definitions.git
          - name: revision
            value: main
          - name: pathInRepo
            value: task/eaas-provision-space/0.1/eaas-provision-space.yaml
      params:
        - name: ownerName
          value: $(context.pipelineRun.name)
        - name: ownerUid
          value: $(context.pipelineRun.uid)

    # ── 3. Get Unreleased Bundle from FBC ──────────────────────────────
    - name: get-unreleased-bundle
      runAfter:
        - provision-eaas-space
      taskSpec:
        results:
          - name: unreleasedBundle
            value: "$(steps.get-bundle.results.unreleasedBundle)"
          - name: packageName
            value: "$(steps.get-bundle.results.packageName)"
          - name: channelName
            value: "$(steps.get-bundle.results.channelName)"
        steps:
          - name: get-bundle
            computeResources:
              limits:
                memory: 8Gi
              requests:
                memory: 8Gi
                cpu: "1"
            ref:
              resolver: git
              params:
                - name: url
                  value: https://github.com/konflux-ci/tekton-integration-catalog.git
                - name: revision
                  value: main
                - name: pathInRepo
                  value: stepactions/bundles/get-unreleased-bundle/0.1/get-unreleased-bundle.yaml
            params:
              - name: fbcFragment
                value: "$(tasks.parse-metadata.results.component-container-image)"
              - name: packageName
                value: $(params.PACKAGE_NAME)
              - name: channelName
                value: $(params.CHANNEL_NAME)

    # ── 4. Pick Cluster Params ─────────────────────────────────────────
    - name: pick-cluster-params
      runAfter:
        - get-unreleased-bundle
      when:
        - input: "$(tasks.get-unreleased-bundle.results.unreleasedBundle)"
          operator: notin
          values: [""]
      taskSpec:
        results:
          - name: ocpVersion
            value: "$(steps.pick-cluster-version.results.ocpVersion)"
          - name: bundleArch
            value: "$(steps.pick-cluster-arch.results.bundleArch)"
        steps:
          - name: get-supported-versions
            ref:
              resolver: git
              params:
                - name: url
                  value: https://github.com/konflux-ci/build-definitions.git
                - name: revision
                  value: main
                - name: pathInRepo
                  value: stepactions/eaas-get-supported-ephemeral-cluster-versions/0.1/eaas-get-supported-ephemeral-cluster-versions.yaml
            params:
              - name: eaasSpaceSecretRef
                value: "$(tasks.provision-eaas-space.results.secretRef)"
          - name: pick-cluster-version
            ref:
              resolver: git
              params:
                - name: url
                  value: https://github.com/konflux-ci/tekton-integration-catalog.git
                - name: revision
                  value: main
                - name: pathInRepo
                  value: stepactions/bundles/pick-cluster-version/0.1/pick-cluster-version.yaml
            params:
              - name: fbcFragment
                value: "$(tasks.parse-metadata.results.component-container-image)"
              - name: clusterVersions
                value: ["$(steps.get-supported-versions.results.versions[*])"]
          - name: pick-cluster-arch
            ref:
              resolver: git
              params:
                - name: url
                  value: https://github.com/konflux-ci/tekton-integration-catalog.git
                - name: revision
                  value: main
                - name: pathInRepo
                  value: stepactions/bundles/pick-cluster-arch/0.1/pick-cluster-arch.yaml
            params:
              - name: bundleImage
                value: "$(tasks.parse-metadata.results.component-container-image)"

    # ── 5. Provision Ephemeral Cluster ─────────────────────────────────
    - name: provision-cluster
      runAfter:
        - pick-cluster-params
      when:
        - input: "$(tasks.get-unreleased-bundle.results.unreleasedBundle)"
          operator: notin
          values: [""]
        - input: "$(tasks.pick-cluster-params.results.ocpVersion)"
          operator: notin
          values: [""]
        - input: "$(tasks.pick-cluster-params.results.bundleArch)"
          operator: notin
          values: [""]
      taskSpec:
        results:
          - name: clusterName
            value: "$(steps.create-cluster.results.clusterName)"
        steps:
          - name: get-latest-version-tag
            ref:
              resolver: git
              params:
                - name: url
                  value: https://github.com/konflux-ci/build-definitions.git
                - name: revision
                  value: main
                - name: pathInRepo
                  value: stepactions/eaas-get-latest-openshift-version-by-prefix/0.1/eaas-get-latest-openshift-version-by-prefix.yaml
            params:
              - name: prefix
                value: "$(tasks.pick-cluster-params.results.ocpVersion)"
          - name: create-cluster
            ref:
              resolver: git
              params:
                - name: url
                  value: https://github.com/konflux-ci/build-definitions.git
                - name: revision
                  value: main
                - name: pathInRepo
                  value: stepactions/eaas-create-ephemeral-cluster-hypershift-aws/0.1/eaas-create-ephemeral-cluster-hypershift-aws.yaml
            params:
              - name: eaasSpaceSecretRef
                value: $(tasks.provision-eaas-space.results.secretRef)
              - name: version
                value: "$(steps.get-latest-version-tag.results.version)"
              - name: instanceType
                value: "$(tasks.pick-cluster-params.results.bundleArch)"

    # ── 6. Deploy Operator + Operands + Run Certsuite ──────────────────
    - name: deploy-and-test
      runAfter:
        - provision-cluster
      when:
        - input: "$(tasks.get-unreleased-bundle.results.unreleasedBundle)"
          operator: notin
          values: [""]
      params:
        - name: eaasSpaceSecretRef
          value: $(tasks.provision-eaas-space.results.secretRef)
        - name: clusterName
          value: "$(tasks.provision-cluster.results.clusterName)"
        - name: fbcFragment
          value: "$(tasks.parse-metadata.results.component-container-image)"
        - name: bundleImage
          value: "$(tasks.get-unreleased-bundle.results.unreleasedBundle)"
        - name: packageName
          value: "$(tasks.get-unreleased-bundle.results.packageName)"
        - name: channelName
          value: "$(tasks.get-unreleased-bundle.results.channelName)"
        - name: testBundleRef
          value: $(params.TEST_BUNDLE_REF)
        - name: certsuiteLabels
          value: $(params.CERTSUITE_LABELS)
      taskSpec:
        params:
          - name: eaasSpaceSecretRef
            type: string
          - name: clusterName
            type: string
          - name: fbcFragment
            type: string
          - name: bundleImage
            type: string
          - name: packageName
            type: string
          - name: channelName
            type: string
          - name: testBundleRef
            type: string
          - name: certsuiteLabels
            type: string
        volumes:
          - name: credentials
            emptyDir: {}
        steps:
          # ── Step 1: Get kubeconfig from EaaS ─────────────────────────
          - name: get-kubeconfig
            ref:
              resolver: git
              params:
                - name: url
                  value: https://github.com/konflux-ci/build-definitions.git
                - name: revision
                  value: main
                - name: pathInRepo
                  value: stepactions/eaas-get-ephemeral-cluster-credentials/0.1/eaas-get-ephemeral-cluster-credentials.yaml
            params:
              - name: eaasSpaceSecretRef
                value: $(params.eaasSpaceSecretRef)
              - name: clusterName
                value: $(params.clusterName)
              - name: credentials
                value: credentials

          # ── Step 2: Deploy operator via OLM ──────────────────────────
          - name: deploy-operator
            image: quay.io/konflux-ci/konflux-test:v1.4.31@sha256:a7cae9e96663e277a3904d0c78630508ddb6cc8eebaa912a840bd20f68dcaad1
            onError: continue
            computeResources:
              limits:
                memory: 4Gi
              requests:
                memory: 4Gi
                cpu: 500m
            volumeMounts:
              - name: credentials
                mountPath: /credentials
            env:
              - name: KUBECONFIG
                value: "/credentials/$(steps.get-kubeconfig.results.kubeconfig)"
              - name: FBC_FRAGMENT
                value: "$(params.fbcFragment)"
              - name: BUNDLE_IMAGE
                value: "$(params.bundleImage)"
              - name: PACKAGE_NAME
                value: "$(params.packageName)"
              - name: CHANNEL_NAME
                value: "$(params.channelName)"
            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              echo "[$(date -u +%FT%T.%3NZ)] Deploying operator: package=${PACKAGE_NAME} channel=${CHANNEL_NAME}"
              oc whoami || { echo "ERROR: Cannot connect to cluster"; exit 1; }

              # ── Wait for at least one worker node to be Ready ──────────────
              echo "[$(date -u +%FT%T.%3NZ)] Waiting for worker nodes..."
              for i in $(seq 1 90); do
                READY_NODES=$(oc get nodes --no-headers 2>/dev/null | grep -c ' Ready' || echo "0")
                if [[ "${READY_NODES}" -gt 0 ]]; then
                  echo "[$(date -u +%FT%T.%3NZ)] ${READY_NODES} node(s) Ready"
                  break
                fi
                [[ ${i} -eq 90 ]] && { echo "ERROR: No nodes became Ready within 450s"; exit 1; }
                sleep 5
              done

              # ── Render FBC and resolve bundle image ────────────────────────
              echo "[$(date -u +%FT%T.%3NZ)] Rendering FBC fragment..."
              opm render "${FBC_FRAGMENT}" > /tmp/fbc.json

              BUNDLE_NAME=$(jq -r 'select(.schema == "olm.bundle") | .name' /tmp/fbc.json | head -1)
              echo "[$(date -u +%FT%T.%3NZ)] Bundle name: ${BUNDLE_NAME}"

              ORIG_BUNDLE_IMG=$(jq -r 'select(.schema == "olm.bundle") | .image' /tmp/fbc.json | head -1)
              echo "[$(date -u +%FT%T.%3NZ)] Original bundle image: ${ORIG_BUNDLE_IMG}"

              FBC_BASE="${FBC_FRAGMENT%%@*}"
              TENANT_AND_REPO="${FBC_BASE#quay.io/redhat-user-workloads/}"
              TENANT="${TENANT_AND_REPO%%/*}"
              FBC_REPO="${TENANT_AND_REPO#*/}"
              BUNDLE_DIGEST="${BUNDLE_IMAGE##*@}"
              BUNDLE_REPO=$(echo "${FBC_REPO}" | sed 's/-fbc-/-bundle-mono-/')
              QUAY_BUNDLE="quay.io/redhat-user-workloads/${TENANT}/${BUNDLE_REPO}@${BUNDLE_DIGEST}"

              echo "[$(date -u +%FT%T.%3NZ)] Trying: ${QUAY_BUNDLE}"
              if ! skopeo inspect --raw "docker://${QUAY_BUNDLE}" &>/dev/null; then
                BUNDLE_REPO2=$(echo "${FBC_REPO}" | sed 's/-fbc-/-bundle-/')
                QUAY_BUNDLE="quay.io/redhat-user-workloads/${TENANT}/${BUNDLE_REPO2}@${BUNDLE_DIGEST}"
                echo "[$(date -u +%FT%T.%3NZ)] Trying: ${QUAY_BUNDLE}"
                skopeo inspect --raw "docker://${QUAY_BUNDLE}" &>/dev/null || \
                  { echo "ERROR: Cannot resolve bundle at quay.io"; exit 1; }
              fi
              echo "[$(date -u +%FT%T.%3NZ)] Resolved bundle: ${QUAY_BUNDLE}"

              # Replace the bundle image in FBC (use actual image from FBC, not param)
              sed "s|${ORIG_BUNDLE_IMG}|${QUAY_BUNDLE}|g" /tmp/fbc.json > /tmp/fbc-patched.json

              # ── Determine install namespace from FBC metadata ──────────────
              INSTALL_NAMESPACE=$(jq -r 'select(.schema == "olm.bundle") | .properties[]? |
                select(.type == "olm.csv.metadata") | .value.annotations["operatorframework.io/suggested-namespace"] // empty' \
                /tmp/fbc.json 2>/dev/null | grep -v '^$' | head -1)

              if [[ -z "${INSTALL_NAMESPACE}" || "${INSTALL_NAMESPACE}" == "null" ]]; then
                INSTALL_NAMESPACE=$(oc create -f - -o jsonpath='{.metadata.name}' <<NS_EOF
              apiVersion: v1
              kind: Namespace
              metadata:
                generateName: oo-
              NS_EOF
                )
              elif ! oc get namespace "${INSTALL_NAMESPACE}" &>/dev/null; then
                oc create namespace "${INSTALL_NAMESPACE}"
              fi

              echo "[$(date -u +%FT%T.%3NZ)] Namespace: ${INSTALL_NAMESPACE}"
              echo -n "${INSTALL_NAMESPACE}" > /workspace/install-namespace

              # ── OperatorGroup (OwnNamespace) ───────────────────────────────
              EXISTING_OG=$(oc -n "${INSTALL_NAMESPACE}" get operatorgroup -o jsonpath="{.items[*].metadata.name}" 2>/dev/null || true)
              if [[ -z "${EXISTING_OG}" ]]; then
                oc create -f - <<OG_EOF
              apiVersion: operators.coreos.com/v1
              kind: OperatorGroup
              metadata:
                generateName: oo-
                namespace: ${INSTALL_NAMESPACE}
              spec:
                targetNamespaces:
                  - ${INSTALL_NAMESPACE}
              OG_EOF
              fi

              # ── Deploy patched FBC catalog server (subPath mount) ──────────
              echo "[$(date -u +%FT%T.%3NZ)] Creating patched FBC catalog..."
              oc create configmap patched-fbc-catalog \
                --from-file=catalog.json=/tmp/fbc-patched.json \
                -n "${INSTALL_NAMESPACE}"

              oc apply -f - <<CATALOG_SERVER_EOF
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: patched-fbc-server
                namespace: ${INSTALL_NAMESPACE}
              spec:
                replicas: 1
                selector:
                  matchLabels:
                    app: patched-fbc-server
                template:
                  metadata:
                    labels:
                      app: patched-fbc-server
                  spec:
                    containers:
                      - name: opm
                        image: ${FBC_FRAGMENT}
                        command: ["/bin/opm", "serve", "/catalog"]
                        ports:
                          - containerPort: 50051
                            name: grpc
                        volumeMounts:
                          - name: catalog
                            mountPath: /catalog/catalog.json
                            subPath: catalog.json
                        readinessProbe:
                          exec:
                            command: ["/bin/grpc_health_probe", "-addr=:50051"]
                          initialDelaySeconds: 5
                          periodSeconds: 10
                    volumes:
                      - name: catalog
                        configMap:
                          name: patched-fbc-catalog
              ---
              apiVersion: v1
              kind: Service
              metadata:
                name: patched-fbc-server
                namespace: ${INSTALL_NAMESPACE}
              spec:
                selector:
                  app: patched-fbc-server
                ports:
                  - port: 50051
                    targetPort: 50051
                    protocol: TCP
              CATALOG_SERVER_EOF

              echo "[$(date -u +%FT%T.%3NZ)] Waiting for catalog server..."
              if ! oc rollout status deployment/patched-fbc-server -n "${INSTALL_NAMESPACE}" --timeout=300s; then
                echo "ERROR: catalog server rollout failed" >&2
                oc get pods -n "${INSTALL_NAMESPACE}" -l app=patched-fbc-server -o wide 2>&1 || true
                POD=$(oc get pods -n "${INSTALL_NAMESPACE}" -l app=patched-fbc-server \
                  -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")
                [[ -n "${POD}" ]] && oc logs "${POD}" -n "${INSTALL_NAMESPACE}" --tail=20 2>&1 || true
                exit 1
              fi

              # ── CatalogSource ──────────────────────────────────────────────
              CATSRC=$(oc create -f - -o jsonpath='{.metadata.name}' <<CS_EOF
              apiVersion: operators.coreos.com/v1alpha1
              kind: CatalogSource
              metadata:
                generateName: oo-
                namespace: ${INSTALL_NAMESPACE}
              spec:
                sourceType: grpc
                address: "patched-fbc-server.${INSTALL_NAMESPACE}.svc:50051"
                displayName: "Certsuite Test Catalog"
                publisher: "konflux-certsuite"
              CS_EOF
              )

              for i in $(seq 1 60); do
                STATE=$(oc get catalogsource "${CATSRC}" -n "${INSTALL_NAMESPACE}" \
                  -o jsonpath='{.status.connectionState.lastObservedState}' 2>/dev/null || echo "")
                [[ "${STATE}" == "READY" ]] && break
                [[ ${i} -eq 60 ]] && { echo "ERROR: CatalogSource not ready"; exit 1; }
                sleep 10
              done
              echo "[$(date -u +%FT%T.%3NZ)] CatalogSource ${CATSRC} READY"

              # ── Subscription (Manual — approve InstallPlan explicitly) ──────
              SUB=$(oc create -f - -o jsonpath='{.metadata.name}' <<SUB_EOF
              apiVersion: operators.coreos.com/v1alpha1
              kind: Subscription
              metadata:
                generateName: oo-
                namespace: ${INSTALL_NAMESPACE}
              spec:
                channel: ${CHANNEL_NAME}
                installPlanApproval: Manual
                name: ${PACKAGE_NAME}
                source: ${CATSRC}
                sourceNamespace: ${INSTALL_NAMESPACE}
                startingCSV: ${BUNDLE_NAME}
              SUB_EOF
              )

              # Wait for InstallPlan, then approve it
              echo "[$(date -u +%FT%T.%3NZ)] Waiting for InstallPlan..."
              IP=""
              for i in $(seq 1 60); do
                IP=$(oc get subscription "${SUB}" -n "${INSTALL_NAMESPACE}" \
                  -o jsonpath='{.status.installPlanRef.name}' 2>/dev/null || echo "")
                [[ -n "${IP}" ]] && break
                sleep 5
              done
              if [[ -z "${IP}" ]]; then
                echo "ERROR: No InstallPlan created" >&2
                oc get subscription "${SUB}" -n "${INSTALL_NAMESPACE}" -o yaml >&2
                exit 1
              fi
              echo "[$(date -u +%FT%T.%3NZ)] Approving InstallPlan ${IP}..."
              oc patch installplan "${IP}" -n "${INSTALL_NAMESPACE}" \
                --type merge -p '{"spec":{"approved":true}}' 2>&1

              # Wait for OLM to create CSV
              echo "[$(date -u +%FT%T.%3NZ)] Waiting for OLM to create CSV..."
              CSV=""
              for i in $(seq 1 60); do
                CSV=$(oc get subscription "${SUB}" -n "${INSTALL_NAMESPACE}" \
                  -o jsonpath='{.status.installedCSV}' 2>/dev/null || echo "")
                [[ -n "${CSV}" ]] && break
                sleep 5
              done
              if [[ -z "${CSV}" ]]; then
                echo "ERROR: OLM did not create CSV" >&2
                oc get subscription "${SUB}" -n "${INSTALL_NAMESPACE}" -o yaml >&2
                exit 1
              fi
              echo "[$(date -u +%FT%T.%3NZ)] CSV created: ${CSV}"

              # ── Dynamically resolve registry.redhat.io images to quay.io ───
              echo "[$(date -u +%FT%T.%3NZ)] Resolving operator images to quay.io..."
              CSV_JSON=$(oc get csv "${CSV}" -n "${INSTALL_NAMESPACE}" -o json)

              RH_IMAGES=$(echo "${CSV_JSON}" | grep -oE 'registry\.redhat\.io/[^"\\]+@sha256:[a-f0-9]+' | sort -u || true)
              echo "  Found $(echo "${RH_IMAGES}" | grep -c . || echo 0) registry.redhat.io image(s)"

              TENANT_REPOS=$(curl -s "https://quay.io/api/v1/find/repositories?query=redhat-user-workloads/${TENANT}" 2>/dev/null \
                | jq -r '.results[]?.name' 2>/dev/null \
                | sed "s|^${TENANT}/||" || true)

              for RH_IMG in ${RH_IMAGES}; do
                IMG_DIGEST="${RH_IMG##*@}"
                FOUND=""
                for REPO in ${TENANT_REPOS}; do
                  QUAY_REF="quay.io/redhat-user-workloads/${TENANT}/${REPO}@${IMG_DIGEST}"
                  if skopeo inspect --raw "docker://${QUAY_REF}" &>/dev/null; then
                    echo "  ${RH_IMG} → ${QUAY_REF}"
                    CSV_JSON=$(echo "${CSV_JSON}" | sed "s|${RH_IMG}|${QUAY_REF}|g")
                    FOUND=1
                    break
                  fi
                done
                if [[ -z "${FOUND}" ]]; then
                  if echo "${RH_IMG}" | grep -q 'kube-rbac-proxy'; then
                    FALLBACK="quay.io/brancz/kube-rbac-proxy:v0.18.1"
                    echo "  ${RH_IMG} → ${FALLBACK} (upstream fallback)"
                    CSV_JSON=$(echo "${CSV_JSON}" | sed "s|${RH_IMG}|${FALLBACK}|g")
                  else
                    echo "  ${RH_IMG} → kept (not on quay.io)"
                  fi
                fi
              done

              # Remove minKubeVersion and master nodeSelector
              CSV_JSON=$(echo "${CSV_JSON}" | jq 'del(.spec.minKubeVersion)')
              CSV_JSON=$(echo "${CSV_JSON}" | jq '
                (.spec.install.spec.deployments[]?.spec.template.spec.nodeSelector) |=
                (if . then del(.["node-role.kubernetes.io/master"]) else . end)')

              echo "[$(date -u +%FT%T.%3NZ)] Applying patched CSV..."
              echo "${CSV_JSON}" | oc replace -f - 2>&1

              # ── Wait for CSV Succeeded ─────────────────────────────────────
              echo "[$(date -u +%FT%T.%3NZ)] Waiting for CSV phase=Succeeded..."
              for i in $(seq 1 120); do
                PHASE=$(oc get csv "${CSV}" -n "${INSTALL_NAMESPACE}" \
                  -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
                [[ "${PHASE}" == "Succeeded" ]] && break
                if [[ "${PHASE}" == "Failed" ]]; then
                  echo "ERROR: CSV failed" >&2
                  oc get csv "${CSV}" -n "${INSTALL_NAMESPACE}" -o jsonpath='{.status.message}' >&2
                  echo "" >&2
                  oc get pods -n "${INSTALL_NAMESPACE}" -o wide >&2 || true
                  exit 1
                fi
                if [[ $((i % 6)) -eq 0 ]]; then
                  echo "[$(date -u +%FT%T.%3NZ)] CSV phase: ${PHASE:-unknown} (${i}/120)"
                  oc get pods -n "${INSTALL_NAMESPACE}" --no-headers 2>/dev/null || true
                fi
                sleep 5
              done

              if [[ "${PHASE}" != "Succeeded" ]]; then
                echo "ERROR: Timed out waiting for CSV Succeeded (phase=${PHASE})" >&2
                oc get csv "${CSV}" -n "${INSTALL_NAMESPACE}" -o json 2>/dev/null \
                  | jq '{phase: .status.phase, message: .status.message}' >&2 || true
                oc get pods -n "${INSTALL_NAMESPACE}" -o wide >&2 || true
                exit 1
              fi
              echo "[$(date -u +%FT%T.%3NZ)] Operator installed successfully"

              # ── Certsuite discovery labels ───────────────────────────────────
              # Patch Subscription status so certsuite can discover the operator
              oc patch subscription "${SUB}" -n "${INSTALL_NAMESPACE}" \
                --type merge --subresource status \
                -p "{\"status\":{\"installedCSV\":\"${CSV}\"}}" 2>&1

              # Label CSV for certsuite operator discovery
              oc label csv "${CSV}" -n "${INSTALL_NAMESPACE}" \
                "redhat-best-practices-for-k8s.com/operator=target" --overwrite 2>&1

              # Label DaemonSet pods for certsuite pod discovery
              DS_NAMES=$(oc get daemonsets -n "${INSTALL_NAMESPACE}" -o jsonpath='{.items[*].metadata.name}' 2>/dev/null || echo "")
              for DS in ${DS_NAMES}; do
                echo "[$(date -u +%FT%T.%3NZ)] Patching DaemonSet ${DS} with certsuite labels..."
                oc patch daemonset "${DS}" -n "${INSTALL_NAMESPACE}" --type=merge \
                  -p '{"spec":{"template":{"metadata":{"labels":{"redhat-best-practices-for-k8s.com/generic":"target"}}}}}' 2>&1
                oc rollout status daemonset/"${DS}" -n "${INSTALL_NAMESPACE}" --timeout=120s 2>&1 || true
              done

          # ── Step 3: Deploy operands from test bundle ─────────────────
          - name: deploy-operands
            image: quay.io/konflux-ci/konflux-test:v1.4.31@sha256:a7cae9e96663e277a3904d0c78630508ddb6cc8eebaa912a840bd20f68dcaad1
            onError: continue
            volumeMounts:
              - name: credentials
                mountPath: /credentials
            env:
              - name: KUBECONFIG
                value: "/credentials/$(steps.get-kubeconfig.results.kubeconfig)"
              - name: TEST_BUNDLE_REF
                value: "$(params.testBundleRef)"
            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              INSTALL_NAMESPACE=""
              [[ -f /workspace/install-namespace ]] && INSTALL_NAMESPACE=$(cat /workspace/install-namespace)

              # Fetch test bundle
              BUNDLE_DIR="/workspace/test-bundle"
              mkdir -p "${BUNDLE_DIR}"

              GIT_URL_AND_REV="${TEST_BUNDLE_REF%%#*}"
              BUNDLE_PATH="${TEST_BUNDLE_REF#*#}"
              [[ "${BUNDLE_PATH}" == "${TEST_BUNDLE_REF}" ]] && BUNDLE_PATH="."

              # Split URL@revision — only split on the last '@' after '.git'
              if [[ "${GIT_URL_AND_REV}" == *".git@"* ]]; then
                GIT_URL="${GIT_URL_AND_REV%.git@*}.git"
                GIT_REV="${GIT_URL_AND_REV##*.git@}"
              else
                GIT_URL="${GIT_URL_AND_REV}"
                GIT_REV=""
              fi

              BRANCH_ARGS=""
              [[ -n "${GIT_REV}" ]] && BRANCH_ARGS="-b ${GIT_REV}"

              echo "[$(date -u +%FT%T.%3NZ)] Cloning ${GIT_URL} (rev: ${GIT_REV:-HEAD}, path: ${BUNDLE_PATH})"
              CLONE_DIR=$(mktemp -d)
              git clone --depth 1 ${BRANCH_ARGS} "${GIT_URL}" "${CLONE_DIR}"
              cp -r "${CLONE_DIR}/${BUNDLE_PATH}/." "${BUNDLE_DIR}/"
              rm -rf "${CLONE_DIR}"

              if [[ ! -f "${BUNDLE_DIR}/certsuite-test-bundle.yaml" ]]; then
                echo "ERROR: certsuite-test-bundle.yaml not found" >&2
                exit 1
              fi

              # Determine target namespace
              TARGET_NS=$(grep -A1 'namespace:' "${BUNDLE_DIR}/certsuite-test-bundle.yaml" | tail -1 | awk '{print $NF}' || echo "")
              TARGET_NS="${TARGET_NS:-${INSTALL_NAMESPACE}}"

              echo "[$(date -u +%FT%T.%3NZ)] Deploying operands to: ${TARGET_NS}"

              if [[ -n "${TARGET_NS}" && "${TARGET_NS}" != "${INSTALL_NAMESPACE}" ]]; then
                oc create namespace "${TARGET_NS}" 2>/dev/null || true
              fi

              # Apply prerequisites
              if [[ -d "${BUNDLE_DIR}/prerequisites" ]]; then
                oc apply -n "${TARGET_NS}" -f "${BUNDLE_DIR}/prerequisites/" 2>/dev/null || true
              fi

              # Apply operands
              if [[ -d "${BUNDLE_DIR}/operands" ]]; then
                oc apply -n "${TARGET_NS}" -f "${BUNDLE_DIR}/operands/"
              fi

              # Wait for deployments
              DEPS=$(oc get deployments -n "${TARGET_NS}" -o jsonpath='{.items[*].metadata.name}' 2>/dev/null || echo "")
              for DEP in ${DEPS}; do
                echo "  Waiting for deployment/${DEP}..."
                oc rollout status "deployment/${DEP}" -n "${TARGET_NS}" --timeout=300s || true
              done

              echo "[$(date -u +%FT%T.%3NZ)] Operand deployment complete"

          # ── Step 4: Run certsuite ────────────────────────────────────
          - name: run-certsuite
            image: quay.io/redhat-best-practices-for-k8s/certsuite:latest
            onError: continue
            computeResources:
              limits:
                memory: 4Gi
              requests:
                memory: 2Gi
                cpu: 500m
            volumeMounts:
              - name: credentials
                mountPath: /credentials
            env:
              - name: KUBECONFIG
                value: "/credentials/$(steps.get-kubeconfig.results.kubeconfig)"
              - name: CERTSUITE_LABELS
                value: "$(params.certsuiteLabels)"
            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              # Disable in-cluster config so client-go uses the EaaS kubeconfig
              # instead of the Tekton pod's SA token (Issue #5)
              unset KUBERNETES_SERVICE_HOST KUBERNETES_SERVICE_PORT
              mkdir -p ~/.kube
              cp "${KUBECONFIG}" ~/.kube/config

              RESULTS_DIR="/workspace/results"
              CONFIG_FILE="/workspace/test-bundle/certsuite_config.yml"
              mkdir -p "${RESULTS_DIR}"

              if [[ ! -f "${CONFIG_FILE}" ]]; then
                echo "ERROR: certsuite_config.yml not found in test bundle" >&2
                echo "Each operator test bundle must include a certsuite_config.yml" >&2
                exit 1
              fi

              # Copy to certsuite's default location as well
              mkdir -p config
              cp "${CONFIG_FILE}" config/certsuite_config.yml

              CONFIG_ARGS="--config-file ${CONFIG_FILE}"

              echo "[$(date -u +%FT%T.%3NZ)] Using kubeconfig: ${KUBECONFIG}"

              if [[ -z "${CERTSUITE_LABELS}" ]]; then
                SUITE_DIR="${RESULTS_DIR}/all"
                mkdir -p "${SUITE_DIR}"
                echo "[$(date -u +%FT%T.%3NZ)] Running all certsuite tests"

                set +e
                certsuite run \
                  --kubeconfig "${KUBECONFIG}" \
                  --output-dir "${SUITE_DIR}" \
                  ${CONFIG_ARGS} \
                  2>&1 | tee "${SUITE_DIR}/certsuite.log"
                set -e
              else
                IFS=',' read -ra LABELS <<< "${CERTSUITE_LABELS}"
                for LABEL in "${LABELS[@]}"; do
                  LABEL=$(echo "${LABEL}" | xargs)
                  SUITE_DIR="${RESULTS_DIR}/${LABEL}"
                  mkdir -p "${SUITE_DIR}"

                  echo "[$(date -u +%FT%T.%3NZ)] Running: ${LABEL}"
                  set +e
                  certsuite run \
                    --kubeconfig "${KUBECONFIG}" \
                    --label-filter "${LABEL}" \
                    --output-dir "${SUITE_DIR}" \
                    ${CONFIG_ARGS} \
                    2>&1 | tee "${SUITE_DIR}/certsuite.log"
                  set -e
                done
              fi

              # Print summary
              for CLAIM in "${RESULTS_DIR}"/*/claim.json; do
                [[ -f "${CLAIM}" ]] || continue
                SUITE=$(basename "$(dirname "${CLAIM}")")
                TOTAL=$(jq '.claim.results | length' "${CLAIM}" 2>/dev/null || echo "?")
                PASSED=$(jq '[.claim.results[] | select(.state == "passed")] | length' "${CLAIM}" 2>/dev/null || echo "?")
                FAILED=$(jq '[.claim.results[] | select(.state == "failed")] | length' "${CLAIM}" 2>/dev/null || echo "?")
                echo "[$(date -u +%FT%T.%3NZ)] ${SUITE}: total=${TOTAL} passed=${PASSED} failed=${FAILED}"
              done

          # ── Step 5: Debug — print kubeconfig and hold cluster alive ──
          - name: debug-cluster
            image: quay.io/konflux-ci/konflux-test:v1.4.31@sha256:a7cae9e96663e277a3904d0c78630508ddb6cc8eebaa912a840bd20f68dcaad1
            onError: continue
            volumeMounts:
              - name: credentials
                mountPath: /credentials
            env:
              - name: KUBECONFIG
                value: "/credentials/$(steps.get-kubeconfig.results.kubeconfig)"
            script: |
              #!/usr/bin/env bash
              echo "════════════════════════════════════════════════════"
              echo " DEBUG: Cluster connection info"
              echo "════════════════════════════════════════════════════"
              echo ""
              echo "API Server: $(oc whoami --show-server 2>/dev/null)"
              echo "User: $(oc whoami 2>/dev/null)"
              echo ""
              echo "── kubeconfig ──"
              cat "${KUBECONFIG}" 2>/dev/null
              echo ""
              echo "── admin password ──"
              PASS_FILE=$(ls /credentials/*-password 2>/dev/null | head -1)
              [[ -f "${PASS_FILE}" ]] && cat "${PASS_FILE}"
              echo ""
              echo ""
              echo "── oc login command ──"
              echo "oc login $(oc whoami --show-server 2>/dev/null) -u kubeadmin -p $(cat "${PASS_FILE}" 2>/dev/null) --insecure-skip-tls-verify"
              echo ""
              echo "── Cluster status ──"
              oc get nodes -o wide 2>/dev/null || true
              echo ""
              echo "── Operator status ──"
              INSTALL_NS=""
              [[ -f /workspace/install-namespace ]] && INSTALL_NS=$(cat /workspace/install-namespace)
              if [[ -n "${INSTALL_NS}" ]]; then
                echo "Namespace: ${INSTALL_NS}"
                oc get csv -n "${INSTALL_NS}" -o wide 2>/dev/null || true
                oc get subscription -n "${INSTALL_NS}" -o wide 2>/dev/null || true
                oc get catalogsource -n "${INSTALL_NS}" -o wide 2>/dev/null || true
                oc get pods -n "${INSTALL_NS}" -o wide 2>/dev/null || true
                echo ""
                echo "── Events ──"
                oc get events -n "${INSTALL_NS}" --sort-by='.lastTimestamp' 2>/dev/null | tail -30 || true
              fi
              echo ""
              echo "── Non-running pods (all namespaces) ──"
              oc get pods -A --field-selector=status.phase!=Running,status.phase!=Succeeded 2>/dev/null | head -20 || true
              echo ""
              echo "Sleeping 60 minutes to keep cluster alive for debugging..."
              echo "Cancel the PipelineRun when done."
              sleep 3600

    # Results are printed in the deploy-and-test step's certsuite summary.
    # TODO: Add collect-results as a step inside deploy-and-test when
    # cert-track and OCI push are needed (Konflux IntegrationTestScenarios
    # do not provide pipeline-level workspace bindings).
