apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: deploy-fbc-operator
  labels:
    app.kubernetes.io/part-of: konflux-certsuite
spec:
  description: |
    Deploys an OLM-managed operator from an FBC fragment onto the shared
    cluster. Creates Namespace, OperatorGroup, CatalogSource, and
    Subscription. Optionally applies CSV patches from the operator test
    bundle, then waits for the CSV to reach Succeeded phase.
  params:
    - name: KUBECONFIG_SECRET_NAME
      type: string
      description: Name of the Secret containing the shared cluster kubeconfig
    - name: KUBECONFIG_SECRET_KEY
      type: string
      default: "kubeconfig"
    - name: FBC_FRAGMENT
      type: string
      description: Container image of the FBC fragment
    - name: BUNDLE_IMAGE
      type: string
      description: Unreleased bundle image
    - name: PACKAGE_NAME
      type: string
    - name: CHANNEL_NAME
      type: string
    - name: TEST_BUNDLE_REF
      type: string
      default: ""
      description: |
        Optional git URL to the operator test bundle (with #path). When set,
        optional CSV patches from the bundle are applied after OLM creates
        the CSV and before waiting for Succeeded.
  results:
    - name: installNamespace
      description: Namespace where the operator was installed
    - name: catalogSourceName
      description: Name of the created CatalogSource
    - name: subscriptionName
      description: Name of the created Subscription
    - name: csvName
      description: Name of the installed CSV
  workspaces:
    - name: shared
      description: Shared workspace for passing data between tasks
  volumes:
    - name: kubeconfig
      secret:
        secretName: $(params.KUBECONFIG_SECRET_NAME)
  steps:
    - name: deploy
      image: quay.io/konflux-ci/konflux-test:v1.4.31@sha256:a7cae9e96663e277a3904d0c78630508ddb6cc8eebaa912a840bd20f68dcaad1
      workingDir: $(workspaces.shared.path)
      volumeMounts:
        - name: kubeconfig
          mountPath: /credentials
          readOnly: true
      env:
        - name: KUBECONFIG
          value: "/credentials/$(params.KUBECONFIG_SECRET_KEY)"
        - name: FBC_FRAGMENT
          value: "$(params.FBC_FRAGMENT)"
        - name: BUNDLE_IMAGE
          value: "$(params.BUNDLE_IMAGE)"
        - name: PACKAGE_NAME
          value: "$(params.PACKAGE_NAME)"
        - name: CHANNEL_NAME
          value: "$(params.CHANNEL_NAME)"
        - name: TEST_BUNDLE_REF
          value: "$(params.TEST_BUNDLE_REF)"
        - name: ARTIFACT_DIR
          value: "$(workspaces.shared.path)/konflux-artifacts"
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        mkdir -p "${ARTIFACT_DIR}"

        echo "[$(date -u +%FT%T.%3NZ)] Deploying operator: package=${PACKAGE_NAME} channel=${CHANNEL_NAME}"
        oc whoami || { echo "ERROR: Cannot connect to cluster"; exit 1; }

        if ! bundle_render_out=$(opm render "${BUNDLE_IMAGE}"); then
          echo "ERROR: Failed to render bundle image" >&2
          exit 1
        fi

        # Determine install namespace
        INSTALL_NAMESPACE=$(echo "${bundle_render_out}" | \
          jq -r 'select(.schema == "olm.bundle") | .properties[]? |
          select(.type == "olm.bundle.object") | .value.data' 2>/dev/null | \
          base64 -d 2>/dev/null | \
          jq -r 'select(.kind == "ClusterServiceVersion") |
          .metadata.annotations["operatorframework.io/suggested-namespace"] // empty' 2>/dev/null | \
          head -1)

        if [[ -z "${INSTALL_NAMESPACE}" || "${INSTALL_NAMESPACE}" == "null" ]]; then
          INSTALL_NAMESPACE=$(oc create -f - -o jsonpath='{.metadata.name}' <<NS
        apiVersion: v1
        kind: Namespace
        metadata:
          generateName: oo-
        NS
          )
        elif ! oc get namespace "${INSTALL_NAMESPACE}" &>/dev/null; then
          oc create namespace "${INSTALL_NAMESPACE}"
        fi

        echo "[$(date -u +%FT%T.%3NZ)] Namespace: ${INSTALL_NAMESPACE}"
        echo -n "${INSTALL_NAMESPACE}" > "$(results.installNamespace.path)"

        # Determine install mode
        TARGET_NS=""
        MODES=$(echo "${bundle_render_out}" | jq -r '
          select(.schema == "olm.bundle") | .properties[]? |
          select(.type == "olm.bundle.object") | .value.data' 2>/dev/null | \
          base64 -d 2>/dev/null | jq -r '
          select(.kind == "ClusterServiceVersion") |
          .spec.installModes[] | select(.supported == true) | .type' 2>/dev/null || echo "AllNamespaces")

        if echo "${MODES}" | grep -q "AllNamespaces"; then
          TARGET_NS=""
        elif echo "${MODES}" | grep -q "OwnNamespace"; then
          TARGET_NS="${INSTALL_NAMESPACE}"
        fi

        # OperatorGroup
        EXISTING_OG=$(oc -n "${INSTALL_NAMESPACE}" get operatorgroup -o jsonpath="{.items[*].metadata.name}" 2>/dev/null || true)
        if [[ -z "${EXISTING_OG}" ]]; then
          OG_OP=create
          OG_META="generateName: oo-"
        else
          OG_OP=apply
          OG_META="name: ${EXISTING_OG}"
        fi

        OG=$(oc ${OG_OP} -f - -o jsonpath='{.metadata.name}' <<OG_EOF
        apiVersion: operators.coreos.com/v1
        kind: OperatorGroup
        metadata:
          ${OG_META}
          namespace: ${INSTALL_NAMESPACE}
        spec:
          targetNamespaces: [${TARGET_NS:+\"${TARGET_NS}\"}]
        OG_EOF
        )

        # CatalogSource
        CATSRC=$(oc create -f - -o jsonpath='{.metadata.name}' <<CS_EOF
        apiVersion: operators.coreos.com/v1alpha1
        kind: CatalogSource
        metadata:
          generateName: oo-
          namespace: ${INSTALL_NAMESPACE}
        spec:
          sourceType: grpc
          image: ${FBC_FRAGMENT}
          displayName: "Certsuite Test Catalog"
          publisher: "konflux-certsuite"
        CS_EOF
        )
        echo -n "${CATSRC}" > "$(results.catalogSourceName.path)"

        # Wait for CatalogSource
        for i in $(seq 1 60); do
          STATE=$(oc get catalogsource "${CATSRC}" -n "${INSTALL_NAMESPACE}" \
            -o jsonpath='{.status.connectionState.lastObservedState}' 2>/dev/null || echo "")
          [[ "${STATE}" == "READY" ]] && break
          [[ ${i} -eq 60 ]] && { echo "ERROR: CatalogSource not ready"; exit 1; }
          sleep 10
        done

        # Bundle name & Subscription
        BUNDLE_NAME=$(echo "${bundle_render_out}" | jq -r 'select(.schema == "olm.bundle") | .name' | head -1)

        SUB=$(oc create -f - -o jsonpath='{.metadata.name}' <<SUB_EOF
        apiVersion: operators.coreos.com/v1alpha1
        kind: Subscription
        metadata:
          generateName: oo-
          namespace: ${INSTALL_NAMESPACE}
        spec:
          channel: ${CHANNEL_NAME}
          installPlanApproval: Automatic
          name: ${PACKAGE_NAME}
          source: ${CATSRC}
          sourceNamespace: ${INSTALL_NAMESPACE}
          startingCSV: ${BUNDLE_NAME}
        SUB_EOF
        )
        echo -n "${SUB}" > "$(results.subscriptionName.path)"

        # Wait for OLM to create the CSV (not necessarily Succeeded yet)
        echo "[$(date -u +%FT%T.%3NZ)] Waiting for OLM to create CSV..."
        CSV=""
        for i in $(seq 1 60); do
          CSV=$(oc get subscription "${SUB}" -n "${INSTALL_NAMESPACE}" \
            -o jsonpath='{.status.installedCSV}' 2>/dev/null || echo "")
          [[ -n "${CSV}" ]] && break
          if oc get csv "${BUNDLE_NAME}" -n "${INSTALL_NAMESPACE}" &>/dev/null; then
            CSV="${BUNDLE_NAME}"
            break
          fi
          sleep 5
        done
        if [[ -z "${CSV}" ]]; then
          echo "ERROR: OLM did not create CSV" >&2
          exit 1
        fi
        echo "[$(date -u +%FT%T.%3NZ)] CSV created: ${CSV}"

        # Optional CSV patches from the operator test bundle (no-op if none)
        if [[ -n "${TEST_BUNDLE_REF}" ]]; then
          BUNDLE_DIR="$(workspaces.shared.path)/test-bundle"
          if [[ ! -f "${BUNDLE_DIR}/certsuite-test-bundle.yaml" ]]; then
            mkdir -p "${BUNDLE_DIR}"
            GIT_URL="${TEST_BUNDLE_REF%%#*}"
            BUNDLE_PATH="${TEST_BUNDLE_REF#*#}"
            [[ "${BUNDLE_PATH}" == "${TEST_BUNDLE_REF}" ]] && BUNDLE_PATH="."
            echo "[$(date -u +%FT%T.%3NZ)] Fetching test bundle for CSV patches: ${GIT_URL} (${BUNDLE_PATH})"
            CLONE_DIR=$(mktemp -d)
            git clone --depth 1 "${GIT_URL}" "${CLONE_DIR}"
            cp -r "${CLONE_DIR}/${BUNDLE_PATH}/." "${BUNDLE_DIR}/"
            rm -rf "${CLONE_DIR}"
          fi

          collect_csv_patches() {
            local manifest="${BUNDLE_DIR}/certsuite-test-bundle.yaml"
            if [[ -f "${manifest}" ]] && command -v yq &>/dev/null; then
              local listed
              listed=$(yq -r '.spec.csvPatches[]? | (.path // .) | select(. != null and . != "")' \
                "${manifest}" 2>/dev/null || true)
              if [[ -n "${listed}" ]]; then
                while IFS= read -r rel; do
                  [[ -z "${rel}" || "${rel}" == "null" ]] && continue
                  echo "${BUNDLE_DIR}/${rel}"
                done <<< "${listed}"
                return
              fi
            fi
            if [[ -d "${BUNDLE_DIR}/csv-patches" ]]; then
              find "${BUNDLE_DIR}/csv-patches" \( -name '*.json' -o -name '*.yaml' -o -name '*.yml' \) -type f | sort
            fi
          }

          apply_json6902() {
            python3 - "$1" "$2" <<'PY'
        import json, sys

        def unescape(token: str) -> str:
            return token.replace("~1", "/").replace("~0", "~")

        def parent_and_key(doc, path: str):
            parts = [unescape(p) for p in path.lstrip("/").split("/")]
            cur = doc
            for part in parts[:-1]:
                cur = cur[int(part)] if isinstance(cur, list) else cur[part]
            return cur, parts[-1]

        def apply_ops(doc, ops):
            for op in ops:
                kind, path = op["op"], op["path"]
                if kind == "remove":
                    try:
                        parent, key = parent_and_key(doc, path)
                        if isinstance(parent, list):
                            idx = int(key)
                            if 0 <= idx < len(parent):
                                parent.pop(idx)
                        elif isinstance(parent, dict) and key in parent:
                            del parent[key]
                    except (KeyError, IndexError, TypeError, ValueError):
                        pass
                elif kind in ("add", "replace"):
                    parent, key = parent_and_key(doc, path)
                    value = op["value"]
                    if isinstance(parent, list):
                        if kind == "add" and key == "-":
                            parent.append(value)
                        elif kind == "add":
                            parent.insert(int(key), value)
                        else:
                            parent[int(key)] = value
                    else:
                        parent[key] = value
                else:
                    raise SystemExit(f"unsupported JSON6902 op: {kind}")
            return doc

        csv_path, ops_path = sys.argv[1], sys.argv[2]
        with open(csv_path) as fh:
            doc = json.load(fh)
        with open(ops_path) as fh:
            ops = json.load(fh)
        with open(csv_path, "w") as fh:
            json.dump(apply_ops(doc, ops), fh)
        PY
          }

          mapfile -t CSV_PATCHES < <(collect_csv_patches)
          if [[ ${#CSV_PATCHES[@]} -eq 0 ]]; then
            echo "[$(date -u +%FT%T.%3NZ)] No CSV patches in test bundle (no-op)"
          else
            echo "[$(date -u +%FT%T.%3NZ)] Applying ${#CSV_PATCHES[@]} CSV patch(es) from test bundle"
            TMP_CSV=$(mktemp)
            TMP_OUT=$(mktemp)
            TMP_OPS=$(mktemp)
            oc get csv "${CSV}" -n "${INSTALL_NAMESPACE}" -o json > "${TMP_CSV}"
            for PATCH in "${CSV_PATCHES[@]}"; do
              [[ -f "${PATCH}" ]] || { echo "ERROR: CSV patch not found: ${PATCH}" >&2; exit 1; }
              echo "  Applying: ${PATCH#"${BUNDLE_DIR}"/}"
              if [[ "${PATCH}" == *.json ]]; then
                cp "${PATCH}" "${TMP_OPS}"
                apply_json6902 "${TMP_CSV}" "${TMP_OPS}"
              elif command -v yq &>/dev/null && \
                   yq -o=json '.' "${PATCH}" > "${TMP_OPS}" 2>/dev/null && \
                   python3 -c 'import json,sys; assert isinstance(json.load(open(sys.argv[1])), list)' "${TMP_OPS}" 2>/dev/null; then
                apply_json6902 "${TMP_CSV}" "${TMP_OPS}"
              else
                oc patch --local -f "${TMP_CSV}" --type=strategic --patch-file="${PATCH}" -o json > "${TMP_OUT}"
                mv "${TMP_OUT}" "${TMP_CSV}"
                TMP_OUT=$(mktemp)
              fi
            done
            oc replace -f "${TMP_CSV}"
            rm -f "${TMP_CSV}" "${TMP_OUT}" "${TMP_OPS}"
            echo "[$(date -u +%FT%T.%3NZ)] CSV patches applied"
          fi
        fi

        # Wait for CSV Succeeded
        for i in $(seq 1 90); do
          PHASE=$(oc get csv "${CSV}" -n "${INSTALL_NAMESPACE}" \
            -o jsonpath='{.status.phase}' 2>/dev/null || echo "")
          if [[ "${PHASE}" == "Succeeded" ]]; then
            echo "[$(date -u +%FT%T.%3NZ)] CSV '${CSV}' ready"
            echo -n "${CSV}" > "$(results.csvName.path)"
            exit 0
          fi
          if [[ "${PHASE}" == "Failed" ]]; then
            echo "ERROR: CSV failed" >&2
            oc get csv "${CSV}" -n "${INSTALL_NAMESPACE}" -o jsonpath='{.status.message}' >&2
            exit 1
          fi
          sleep 10
        done

        echo "ERROR: Timed out waiting for CSV" >&2
        exit 1
